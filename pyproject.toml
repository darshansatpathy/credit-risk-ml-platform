[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "credit-risk-ml-platform"
version = "0.1.1"
description = "Credit risk models (scorecard, LightGBM, XGBoost) with monotone constraints, calibration, reason codes, fairness testing, stability monitoring, MLflow and a generated model validation report."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Darshan Kumar Satpathy" }]
keywords = ["credit-risk", "probability-of-default", "lightgbm", "xgboost", "mlflow", "explainability", "fairness", "model-risk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "xgboost>=2.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
mlflow = ["mlflow-skinny>=2.14", "sqlalchemy>=2.0", "alembic>=1.13"]
dev = [
  "credit-risk-ml-platform[mlflow]",
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "pandas-stubs>=2.2",
  "pip-audit>=2.7",
]

[project.scripts]
crisk = "creditrisk.cli:main"

[project.urls]
Repository = "https://github.com/darshansatpathy/credit-risk-ml-platform"

[tool.hatch.build.targets.wheel]
packages = ["src/creditrisk"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "creditrisk/data"
"policy" = "creditrisk/policy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["creditrisk"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
fail_under = 90

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["creditrisk"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["lightgbm.*", "xgboost.*", "sklearn.*", "mlflow.*"]
ignore_missing_imports = true
