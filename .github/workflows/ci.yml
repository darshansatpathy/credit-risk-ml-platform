name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Tests with coverage, including planted-fault tests of the policy gate
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  model-risk:
    name: Model-risk gate and validation report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Train, evaluate against the policy, choose a champion
        run: crisk train --out artifacts --tracking-uri sqlite:///artifacts/mlflow.db --report model-report.md --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-risk
          path: |
            model-report.md
            artifacts/evaluation.json
            artifacts/models/

  package:
    name: Wheel builds and trains from bundled data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: Install the wheel in a clean environment and train from it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/crisk train --out /tmp/out --check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[mlflow]" pip-audit
      - run: pip-audit --skip-editable
